<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#16181d">
<title>window-remote</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header id="toolbar">
  <select id="winSelect" title="제어할 창"><option value="">창 선택…</option></select>
  <button id="btnRefresh" title="창 목록 새로고침">↻</button>
  <button id="btnMode" title="입력 모드">포인터</button>
  <button id="btnKbd" title="키보드">⌨</button>
  <span class="group">
    <button id="btnZoomOut" title="축소">−</button>
    <button id="btnFit" title="화면에 맞춤">맞춤</button>
    <button id="btnZoomIn" title="확대">+</button>
  </span>
  <button id="btnSettings" title="설정">⚙</button>
  <span id="status">연결 중…</span>
</header>

<main id="stage" tabindex="0">
  <canvas id="screen" width="1" height="1"></canvas>
  <div id="cursor" hidden></div>
  <div id="overlay">창을 선택하세요</div>
</main>

<footer id="keybar" hidden>
  <div class="keys">
    <button data-mod="ControlLeft">Ctrl</button>
    <button data-mod="AltLeft">Alt</button>
    <button data-mod="ShiftLeft">Shift</button>
    <button data-mod="MetaLeft">Win</button>
    <button data-code="Escape">Esc</button>
    <button data-code="Tab">Tab</button>
    <button data-code="Enter">Enter</button>
    <button data-code="Backspace">⌫</button>
    <button data-code="Delete">Del</button>
    <button data-code="ArrowLeft">←</button>
    <button data-code="ArrowUp">↑</button>
    <button data-code="ArrowDown">↓</button>
    <button data-code="ArrowRight">→</button>
    <button data-code="Lang1">한/영</button>
    <button data-combo="ControlLeft+KeyZ">Ctrl+Z</button>
    <button data-combo="ControlLeft+KeyC">Ctrl+C</button>
    <button data-combo="ControlLeft+KeyV">Ctrl+V</button>
    <button data-combo="ControlLeft+KeyS">Ctrl+S</button>
  </div>
  <textarea id="kbdInput" rows="1" placeholder="여기에 입력하면 원격 창에 바로 입력됩니다" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
</footer>

<div id="settings" hidden>
  <h2>설정</h2>
  <label>프레임 <select id="setFps">
    <option value="10">10 fps</option><option value="20">20 fps</option>
    <option value="30" selected>30 fps</option><option value="60">60 fps</option>
  </select></label>
  <label>화질 <select id="setQuality">
    <option value="50">낮음 (빠름)</option><option value="75" selected>보통</option><option value="90">높음</option>
  </select></label>
  <label>최대 폭 <select id="setMaxw">
    <option value="0" selected>원본</option><option value="1920">1920</option>
    <option value="1280">1280</option><option value="800">800</option>
  </select></label>
  <label>캡처 방식 <select id="setMethod">
    <option value="screen" selected>화면 (빠름, 창이 보여야 함)</option>
    <option value="window">창 (가려져도 됨)</option>
  </select></label>
  <label>트랙패드 속도 <input id="setSpeed" type="range" min="0.1" max="2" step="0.1" value="1"></label>
  <button id="btnCloseSettings">닫기</button>
</div>

<script src="/static/app.js"></script>
</body>
</html>
