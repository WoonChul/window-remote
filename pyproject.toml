[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "window-remote"
version = "0.1.0"
description = "Control a single selected program window on a Windows PC from a phone, tablet or another PC."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
window-remote = "window_remote.__main__:main"

[tool.setuptools]
packages = ["window_remote", "window_remote.backends"]

[tool.setuptools.package-data]
window_remote = ["web/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
